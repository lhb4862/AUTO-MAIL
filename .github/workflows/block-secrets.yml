name: Block secrets

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  check-tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if forbidden files are tracked
        run: |
          set -e
          forbidden=".env config.json credentials.json secrets.json mail_log.xlsx"
          for f in $forbidden; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::Forbidden file is tracked in git: $f"
              exit 1
            fi
          done

          if git ls-files 'logs/*' | grep -q .; then
            echo "::error::Files under logs/ must not be tracked"
            git ls-files 'logs/*'
            exit 1
          fi

          if git ls-files '.env.*' | grep -v '.env.example' | grep -q .; then
            echo "::error::Only .env.example is allowed; other .env.* files must not be tracked"
            git ls-files '.env.*' | grep -v '.env.example'
            exit 1
          fi

          echo "No forbidden files are tracked."
